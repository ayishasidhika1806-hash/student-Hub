<!DOCTYPE html>

<html>
<head>
    <title>Student Hub</title>

```
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e0c3fc, #8ec5fc);
        margin: 0;
        padding: 30px;
        text-align: center;
    }

    .container {
        max-width: 650px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 5px 20px #888888;
    }

    h1 {
        color: #6c3fc5;
    }

    p {
        color: #666;
    }

    input {
        width: 80%;
        padding: 12px;
        margin: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
    }

    button {
        padding: 11px 18px;
        background: #7b4bd4;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin: 5px;
    }

    button:hover {
        background: #5425a8;
    }

    .student-card {
        background: #f4efff;
        padding: 12px;
        margin: 10px 0;
        border-radius: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        overflow-wrap: anywhere;
    }

    .student-info {
        text-align: left;
    }

    .delete-button {
        background: #e74c3c;
        flex-shrink: 0;
    }

    #count {
        color: #6c3fc5;
        font-weight: bold;
    }
</style>
```

</head>

<body>

<div class="container">

```
<h1>🎓 Student Hub</h1>
<p>Manage your student records easily!</p>

<input id="name" placeholder="Enter Student Name">

<input id="regno" placeholder="Enter Register Number">

<br>

<button onclick="addStudent()">+ Add Student</button>

<h2>Student List</h2>

<input
    id="search"
    placeholder="🔍 Search student..."
    oninput="displayStudents()"
>

<p id="count">Total Students: 0</p>

<div id="list"></div>
```

</div>

<script>
    let students =
        JSON.parse(localStorage.getItem("students")) || [];

    function saveStudents() {
        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );
    }

    function addStudent() {
        let name =
            document.getElementById("name").value.trim();

        let regno =
            document.getElementById("regno").value.trim();

        if (name === "" || regno === "") {
            alert("Please fill all details!");
            return;
        }

        students.push({
            name: name,
            regno: regno
        });

        saveStudents();

        document.getElementById("name").value = "";
        document.getElementById("regno").value = "";

        displayStudents();
    }

    function displayStudents() {
        let list = document.getElementById("list");
        let search =
            document.getElementById("search").value.toLowerCase();

        list.innerHTML = "";

        let filteredStudents = students.filter(function(student) {
            return student.name.toLowerCase().includes(search) ||
                   student.regno.toLowerCase().includes(search);
        });

        document.getElementById("count").textContent =
            "Total Students: " + students.length;

        filteredStudents.forEach(function(student) {
            let card = document.createElement("div");
            card.className = "student-card";

            let info = document.createElement("div");
            info.className = "student-info";
            info.textContent =
                student.name + " — " + student.regno;

            let deleteButton = document.createElement("button");
            deleteButton.className = "delete-button";
            deleteButton.textContent = "Delete";

            deleteButton.onclick = function() {
                students = students.filter(function(item) {
                    return item !== student;
                });

                saveStudents();
                displayStudents();
            };

            card.appendChild(info);
            card.appendChild(deleteButton);
            list.appendChild(card);
        });
    }

    displayStudents();
</script>

</body>
</html>
